services:
  blockstore:
    build: .
    image: blockstore-api:latest
    container_name: blockstore
    ports:
      - "${BLOCKSTORE_PORT:-8000}:8000"
    environment:
      # Path inside the container; overrides the Dockerfile default only if set.
      BLOCKSTORE_DB: /data/blockstore.db
      BLOCKSTORE_BUSY_TIMEOUT_SECONDS: "30"
    volumes:
      - blockstore-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10

volumes:
  blockstore-data:
